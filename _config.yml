# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Cass Staniec | Portfolio

# Hero Section
name: Cass Staniec
headline: Product Design Engineer
description: >-
  I design and prototype products from concept to manufacturing, with a focus on
  mechanical design, rapid prototyping, and practical problem solving.

# Place your profile image in /assets/images/profile-image/ and update the filename.
profile_image: ./assets/images/profile-image/avatar.jpeg

# Link your resume
# You can place your resume in /assets/resume/resume.pdf or use an external Google Drive link.
resume-url: https://drive.google.com/file/d/13Z3duVzh-gguPU5r03oJVEE6rV9rd3DS/view?usp=sharing

# Set up external links - these show up as small icons next to your name.
external-links:
  linkedin: "https://www.linkedin.com/in/cassstaniec"
  github: "https://github.com/cassstaniec"
  stackoverflow: ""
  medium: ""
  x-twitter: ""
  threads: ""
  instagram: ""
  youtube: ""
  discord: ""
  bluesky: ""

# Skills Section - add your skills by category.
skills:
  - category: 3D Modeling
    tools:
      - Onshape
      - Solidworks
      - Creo
      - Fusion 360 (Autodesk)
      - Blender (for complex shapes or animations)
      - Siemens NX
      - Inventor (Autodesk)
      - CATIA (Dassault Systèmes)

  - category: Prototyping
    tools:
      - SLA
      - CNC
      - FDM
      - SLS
      - DMLS
      - PolyJet Printing
      - Vacuum Casting
      - Laser Cutting
      - Water Jet Cutting
      - Arduino / Raspberry Pi
      - Breadboarding for circuit testing

  - category: Design Standards / Practices
    tools:
      - GD&T ASME Y14
      - ISO fits and tolerances
      - PLM (PTC Windchill / Arena)

  - category: PCB Design
    tools:
      - Altium Designer
      - Altium
      - Eagle
      - KiCad

  - category: Problem Solving / Risk Management
    tools:
      - Root Cause Analysis (e.g., 5 Whys, Fishbone Diagram)
      - DFMEA / PFMEA
      - Six Sigma methodologies
      - Shain Red-X

# Contact Form Setup. Create a Formspree account and replace the form ID below.
formspree-key: ""

