<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go-Kart — Electronics — Cass Staniec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ===== Video stage =====
   Same 260px height as the photos beside it. If a clip is stored sideways,
   the stage gets the .rotated class and the video is turned 90deg left. */
.rot-stage{
  position:relative;
  height:260px;
  overflow:hidden;
  background:#000;
  container-type:size;
}
.gallery .rot-stage video{
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:pointer;
}
.gallery .rot-stage.rotated video{
  position:absolute;
  top:50%;
  left:50%;
  width:100cqh;   /* stage height becomes the video's width */
  height:100cqw;  /* stage width becomes the video's height */
  transform:translate(-50%,-50%) rotate(-90deg);
}

/* ===== Custom controls (native ones would rotate with the video) ===== */
.vc{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-top:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;
  font-size:0.72rem;
  color:var(--grey);
}
.vc button{
  font:inherit;
  color:var(--ink);
  background:none;
  border:1px solid var(--rule);
  padding:3px 8px;
  min-width:56px;
  cursor:pointer;
}
.vc button:hover{color:var(--accent);border-color:var(--accent);}
.vc input[type=range]{flex:1;min-width:0;accent-color:var(--accent);}
.vc .vc-time{white-space:nowrap;}

/* ===== Video captions with descriptions ===== */
.gallery figcaption .cap-title{
  display:block;
  color:var(--ink);
  font-weight:500;
}
.gallery figcaption .cap-desc{
  display:block;
  margin-top:6px;
  font-family:'Space Grotesk',sans-serif;
  font-size:0.88rem;
  line-height:1.55;
  color:var(--grey);
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="project-go-kart.html">&larr; back to go-kart overview</a>

  <h2 class="project-title">Electronics</h2>
  <p class="project-summary">
    Wiring, throttle and kill-switch systems, and electrical integration on the go-kart.
  </p>

  <div class="gallery">

    <!-- Video: completed working motor mockup -->
    <figure class="vid">
      <div class="rot-stage" data-rotate="none">
        <video preload="metadata" playsinline>
          <source src="gokart-electronics-1.mp4" type="video/mp4">
        </video>
      </div>
      <div class="vc">
        <button type="button" class="vc-play" aria-label="Play or pause video">Play</button>
        <input type="range" class="vc-seek" min="0" max="1000" value="0" aria-label="Seek">
        <span class="vc-time">0:00 / 0:00</span>
      </div>
      <figcaption>
        <span class="cap-title">Electronics — completed working motor mockup</span>
        <span class="cap-desc">
          A finished, fully working mockup of the go-kart&rsquo;s motor system, built and tested on the bench
          before anything went into the kart. The clip shows the motor running on its own electronics, so the
          wiring and control layout could be proven out first. That same layout is what I then carried over
          to the real build.
        </span>
      </figcaption>
    </figure>

    <figure>
      <a href="#lb-electronics-2"><img src="gokart-electronics-2.jpg" alt="Go-kart electronics photo 2"></a>
      <figcaption>Electronics — photo 2</figcaption>
    </figure>

    <!-- Video: wiring the actual go-kart -->
    <figure class="vid">
      <div class="rot-stage" data-rotate="auto">
        <video preload="metadata" playsinline>
          <source src="gokart-electronics-3.mp4" type="video/mp4">
        </video>
      </div>
      <div class="vc">
        <button type="button" class="vc-play" aria-label="Play or pause video">Play</button>
        <input type="range" class="vc-seek" min="0" max="1000" value="0" aria-label="Seek">
        <span class="vc-time">0:00 / 0:00</span>
      </div>
      <figcaption>
        <span class="cap-title">Electronics — wiring the actual go-kart</span>
        <span class="cap-desc">
          Footage of me wiring the real go-kart by hand. I run and connect the harness that ties the motor,
          throttle and kill switch into the kart&rsquo;s electrical system, working from what the mockup
          proved out. This is the step where the design becomes a kart that can actually drive.
        </span>
      </figcaption>
    </figure>

    <figure>
      <a href="#lb-electronics-4"><img src="gokart-electronics-4.jpg" alt="Go-kart electronics photo 4"></a>
      <figcaption>Electronics — photo 4</figcaption>
    </figure>
  </div>

  <div id="lb-electronics-2" class="lightbox">
    <a href="#" class="lightbox-backdrop"></a>
    <a href="#" class="lightbox-close">&times;</a>
    <a href="#"><img src="gokart-electronics-2.jpg" alt="Go-kart electronics photo 2"></a>
  </div>


  <footer>
    Built by Cass Staniec — Aerospace &amp; Mechanical Engineering, WMU
  </footer>
</div>

<script>
/* Sets up every <figure class="vid">.
   data-rotate on the stage:
     "left"  – always rotate 90deg left
     "auto"  – rotate 90deg left only if the file's frames are portrait (taller than wide)
     "none"  – never rotate */
document.querySelectorAll('figure.vid').forEach(function(fig){
  var stage = fig.querySelector('.rot-stage'),
      v = fig.querySelector('video'),
      b = fig.querySelector('.vc-play'),
      s = fig.querySelector('.vc-seek'),
      t = fig.querySelector('.vc-time');

  function fmt(x){
    if(!isFinite(x)) return '0:00';
    var m = Math.floor(x/60), r = Math.floor(x%60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function update(){
    s.value = v.duration ? (v.currentTime / v.duration) * 1000 : 0;
    t.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
  }
  function toggle(){ v.paused ? v.play() : v.pause(); }

  v.addEventListener('loadedmetadata', function(){
    if(stage.getAttribute('data-rotate') === 'auto' && v.videoWidth < v.videoHeight){
      stage.classList.add('rotated');
    }
    update();
  });
  b.addEventListener('click', toggle);
  v.addEventListener('click', toggle);
  v.addEventListener('play',  function(){ b.textContent = 'Pause'; });
  v.addEventListener('pause', function(){ b.textContent = 'Play'; });
  v.addEventListener('ended', function(){ b.textContent = 'Play'; });
  v.addEventListener('timeupdate', update);
  s.addEventListener('input', function(){
    if(v.duration) v.currentTime = (s.value / 1000) * v.duration;
  });
});
</script>
</body>
</html>
